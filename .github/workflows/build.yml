name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build release APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RodaLog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RodaLog-apk
          path: RodaLog.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RodaLog.apk \
            --title "RodaLog (latest build)" \
            --notes "APK listo para instalar. Commit: ${GITHUB_SHA::7}"

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          grep -E "^e: |^w: .*error|error:|FAILED|What went wrong|Execution failed|Caused by|Could not|AAPT" "$GITHUB_WORKSPACE/build.log" | head -150 > errors.txt || true
          tail -n 120 "$GITHUB_WORKSPACE/build.log" > tail.txt || true
          git init -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add errors.txt tail.txt
          git commit -q -m "build log ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
